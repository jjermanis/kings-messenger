<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>King Messenger</title>

<style>
body{
    margin:0;
    background:#202020;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

canvas{
    width:512px;
    height:480px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border:4px solid white;
}
</style>
</head>

<body>

<canvas id="game" width="256" height="240"></canvas>

<script>

const SCREEN_WIDTH=256;
const SCREEN_HEIGHT=240;

const TILE_SIZE=16;

const TILE = {
    GRASS: 0,
    ROAD: 1,
    TREE: 2,
    WATER: 3,
    BRIDGE: 4,
    CASTLE: 5,
    VILLAGE: 6
};

const TILE_SOLID = {
    [TILE.GRASS]: false,
    [TILE.ROAD]: false,
    [TILE.TREE]: true,
    [TILE.WATER]: true,
    [TILE.BRIDGE]: false,
    [TILE.CASTLE]: false,
    [TILE.VILLAGE]: false
};

const TILE_COLLISION = {

    [TILE.GRASS]:   null,
    [TILE.ROAD]:    null,
    [TILE.WATER]:   null,
    [TILE.BRIDGE]:  null,
    [TILE.CASTLE]:  null,
    [TILE.VILLAGE]: null,

    // trunk only
    [TILE.TREE]:{
        x:6,
        y:9,
        w:4,
        h:7
    }

};

let MAP_WIDTH=40;
let MAP_HEIGHT=30;

let PLAYER_START_X = 40;
let PLAYER_START_Y = 15 * TILE_SIZE;

const WOLF_SPEED = 2;

const BANDIT_SPEED = 1;
const BANDIT_DETECTION_RANGE = 64;
const BANDIT_CHASE_DISTANCE = 128;

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const titleLogo = new Image();
titleLogo.src = "title.png";

ctx.imageSmoothingEnabled=false;

const State={
    TITLE:0,
    PLAY:1,
    WIN:2,
    GAME_OVER:3
};

const BanditState = {

    PATROL:0,
    CHASE:1,
    RETURN:2

};

let gameState=State.TITLE;
let lastTimerTick = 0;

const keys={};

document.addEventListener("keydown",(e)=>{
    keys[e.key]=true;

    if(gameState===State.TITLE && e.key==="Enter"){
        gameState=State.PLAY;
        player.timeRemaining = 200;
        lastTimerTick = performance.now();
    }
});

document.addEventListener("keyup",(e)=>{
    keys[e.key]=false;
});

const map=[];

async function loadLevel(){

    try{

        const response =
            await fetch("Level1.json",
            {
                cache: "no-store"
            }
        );

        if(!response.ok){

            throw new Error();

        }

        const level =
            await response.json();

        MAP_WIDTH = level.width;
        MAP_HEIGHT = level.height;

        PLAYER_START_X =
            level.playerStart.x * TILE_SIZE;

        PLAYER_START_Y =
            level.playerStart.y * TILE_SIZE;

        map.length = 0;

        for(let y=0;y<MAP_HEIGHT;y++){

            map.push(
                level.tiles[y].slice()
            );

        }

enemies.length = 0;

for(const e of level.enemies){

    enemies.push({

        type: e.type,

        startX: e.x * TILE_SIZE,
        startY: e.y * TILE_SIZE,

        x: e.x * TILE_SIZE,
        y: e.y * TILE_SIZE,

        width: 8,
        height: 8,

        direction: -1,

        speed:
            e.type == 0 ?
                WOLF_SPEED :
                BANDIT_SPEED,

        patrolAxis: "horizontal",

        state: BanditState.PATROL

    });

}

    }
    catch(error){

        alert(
            "Unable to load Level1.json"
        );

        throw error;

    }

}

const player = {

    x: PLAYER_START_X,
    y: PLAYER_START_Y,

    width:8,
    height:8,

    speed:1,

    remainingLives:2,

    timeRemaining:200
};

const enemies = [];

function drawGrass(x,y){

    ctx.fillStyle="#4CAF50";
    ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

}

function drawRoad(x,y){

    ctx.fillStyle="#B07D45";
    ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

}

function drawTree(x,y){

    drawGrass(x,y);

    ctx.fillStyle="#0A5A0A";
    ctx.fillRect(x+4,y+2,8,8);

    ctx.fillStyle="#704020";
    ctx.fillRect(x+7,y+10,2,5);

}

function drawWater(x, y){

    // Dark blue background

    ctx.fillStyle = "#2050C0";
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

    // Light blue ripples

    ctx.fillStyle = "#70B8FF";

    ctx.fillRect(x+2, y+3, 3, 1);
    ctx.fillRect(x+8, y+6, 4, 1);
    ctx.fillRect(x+4, y+11, 5, 1);

}

function drawBridge(x, y){

    // Wooden deck

    ctx.fillStyle = "#8B5A2B";
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

    // Side rails

    ctx.fillStyle = "#5A3515";

    ctx.fillRect(x, 0 + y, TILE_SIZE, 2);
    ctx.fillRect(x, y + 14, TILE_SIZE, 2);

    // Planks

    ctx.fillStyle = "#C09050";

    ctx.fillRect(x + 2, y + 4, 12, 1);
    ctx.fillRect(x + 2, y + 8, 12, 1);
    ctx.fillRect(x + 2, y + 12, 12, 1);

}

function drawCastle(x,y){

    ctx.fillStyle="#B0B0B0";
    ctx.fillRect(x+1,y+2,14,12);

    ctx.fillStyle="#808080";

    ctx.fillRect(x+3,y,2,4);
    ctx.fillRect(x+11,y,2,4);

}

function drawVillage(x,y){

    ctx.fillStyle="#DDDD88";
    ctx.fillRect(x+2,y+5,12,9);

    ctx.fillStyle="#AA3333";
    ctx.beginPath();
    ctx.moveTo(x+1,y+5);
    ctx.lineTo(x+8,y);
    ctx.lineTo(x+15,y+5);
    ctx.fill();

}

function drawPlayer(){

    const px = Math.floor(player.x) - camera.renderX;
    const py = Math.floor(player.y) - camera.renderY;

    ctx.fillStyle="#0000AA";
    ctx.fillRect(
        px+4,
        py+2,
        8,
        12);

    ctx.fillStyle="#FFFF66";
    ctx.fillRect(
        px+5,
        py,
        6,
        5);

}

function drawWolf(enemy){

    const x = Math.floor(enemy.x) - camera.renderX;
    const y = Math.floor(enemy.y) - camera.renderY;

    ctx.fillStyle="#555555";

    ctx.fillRect(x+3,y+5,10,6);

    ctx.fillRect(x+1,y+7,3,3);
    ctx.fillRect(x+12,y+7,3,3);

    ctx.fillStyle="#FFFFFF";

    ctx.fillRect(x+9,y+6,2,2);

}

function drawBandit(enemy){

    const x = Math.floor(enemy.x)-camera.renderX;
    const y = Math.floor(enemy.y)-camera.renderY;

    ctx.fillStyle="#884400";

    ctx.fillRect(x+3,y+2,10,12);

    ctx.fillStyle="#FFFF88";

    ctx.fillRect(x+5,y,6,5);

}

const camera={
    x:0,
    y:0,
    renderX:0,
    renderY:0
};

function rectsOverlap(ax, ay, aw, ah,
                      bx, by, bw, bh){

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );

}

function collidesWithWorld(px, py){

    const playerLeft   = px + 4;
    const playerTop    = py + 4;
    const playerWidth  = player.width;
    const playerHeight = player.height;

    const startTileX = Math.floor(playerLeft / TILE_SIZE);
    const startTileY = Math.floor(playerTop / TILE_SIZE);

    const endTileX =
        Math.floor((playerLeft + playerWidth) / TILE_SIZE);

    const endTileY =
        Math.floor((playerTop + playerHeight) / TILE_SIZE);

    for(let ty=startTileY; ty<=endTileY; ty++){

        for(let tx=startTileX; tx<=endTileX; tx++){

            if(tx<0 || ty<0 ||
               tx>=MAP_WIDTH ||
               ty>=MAP_HEIGHT)
                return true;

            const tile = map[ty][tx];

            // Full-tile collision (water, future walls, etc.)
            if(TILE_SOLID[tile]){

                if(tile != TILE.TREE)
                    return true;
            }

            const shape = TILE_COLLISION[tile];

            if(shape==null)
                continue;

            if(rectsOverlap(

                playerLeft,
                playerTop,
                playerWidth,
                playerHeight,

                tx*TILE_SIZE + shape.x,
                ty*TILE_SIZE + shape.y,
                shape.w,
                shape.h

            )){
                return true;
            }

        }

    }

    return false;

}

function distanceSquared(x1,y1,x2,y2){

    const dx=x2-x1;
    const dy=y2-y1;

    return dx*dx+dy*dy;

}

function moveBandit(enemy, dx, dy){

    let nextX = enemy.x + dx;
    let nextY = enemy.y + dy;

    if(collidesWithWorld(nextX, nextY))
        return false;

    enemy.x = nextX;
    enemy.y = nextY;

    return true;

}



function updateWolf(enemy){

    let nextX = enemy.x + enemy.direction * enemy.speed;

    if(collidesWithWorld(nextX, enemy.y)){

        enemy.direction *= -1;

    }
    else{

        enemy.x = nextX;

    }

}

function updateBandit(enemy){

    switch(enemy.state){

        case BanditState.PATROL:

            if(collidesWithWorld(
                enemy.x + enemy.direction*enemy.speed,
                enemy.y))
            {
                enemy.direction*=-1;
            }
            else{

                enemy.x +=
                    enemy.direction*enemy.speed;

            }

            if(
                distanceSquared(

                    player.x,
                    player.y,

                    enemy.x,
                    enemy.y

                )

                <

                BANDIT_DETECTION_RANGE*
                BANDIT_DETECTION_RANGE

            ){

                enemy.state =
                    BanditState.CHASE;

            }

            break;

        case BanditState.CHASE: {

    let dx = player.x - enemy.x;
    let dy = player.y - enemy.y;

    const moveX = Math.sign(dx) * enemy.speed;
    const moveY = Math.sign(dy) * enemy.speed;

    if(Math.abs(dx) >= Math.abs(dy)){

        // Horizontal is the preferred direction

        if(!moveBandit(enemy, moveX,0)){

            moveBandit(enemy, 0,moveY);

        }

    }
    else{

        // Vertical is the preferred direction

        if(!moveBandit(enemy, 0,moveY)){

            moveBandit(enemy, moveX,0);

        }

    }

    if(
        distanceSquared(
            enemy.startX,
            enemy.startY,
            enemy.x,
            enemy.y
        )
        >
        BANDIT_CHASE_DISTANCE *
        BANDIT_CHASE_DISTANCE
    ){

        enemy.state = BanditState.RETURN;

    }

    break;
        }
        case BanditState.RETURN: {

    dx = enemy.startX - enemy.x;
    dy = enemy.startY - enemy.y;

    const returnMoveX = Math.sign(dx) * enemy.speed;
    const returnMoveY = Math.sign(dy) * enemy.speed;

    if(Math.abs(dx) >= Math.abs(dy)){

        // Horizontal is the preferred direction

        if(!moveBandit(enemy, returnMoveX, 0)){

            moveBandit(enemy, 0, returnMoveY);

        }

    }
    else{

        // Vertical is the preferred direction

        if(!moveBandit(enemy, 0, returnMoveY)){

            moveBandit(enemy, returnMoveX, 0);

        }

    }

    // Have we reached home?

    if(Math.abs(dx) < enemy.speed &&
       Math.abs(dy) < enemy.speed){

        enemy.x = enemy.startX;
        enemy.y = enemy.startY;

        enemy.state = BanditState.PATROL;

    }

    break;
        }
    }

}

function playerHitsEnemy(enemy){

    return rectsOverlap(

        player.x + 4,
        player.y + 4,
        player.width,
        player.height,

        enemy.x + 4,
        enemy.y + 4,
        enemy.width,
        enemy.height

    );

}

function loseLife(){

    player.remainingLives--;

    if(player.remainingLives < 0){

        gameState = State.WIN;   // Temporary until GAME_OVER exists.
        return;

    }

    resetPositions();

}

function resetPositions(){

    player.x = PLAYER_START_X;
    player.y = PLAYER_START_Y;

for(const enemy of enemies){

    enemy.x = enemy.startX;
    enemy.y = enemy.startY;

    enemy.direction = -1;
    enemy.state = BanditState.PATROL;

}

    player.timeRemaining = 200;
    lastTimerTick = performance.now();
}

function playerOnTile(tileType){

    const tileX = Math.floor((player.x + 8) / TILE_SIZE);
    const tileY = Math.floor((player.y + 8) / TILE_SIZE);

    if(
        tileX < 0 ||
        tileX >= MAP_WIDTH ||
        tileY < 0 ||
        tileY >= MAP_HEIGHT
    ){
        return false;
    }

    return map[tileY][tileX] === tileType;
}

function update(){

    if(gameState!==State.PLAY) return;

const now = performance.now();

if(now - lastTimerTick >= 1000){

    player.timeRemaining--;

    lastTimerTick += 1000;

    if(player.timeRemaining <= 0){

        loseLife();
        return;

    }

}

let dx = 0;
let dy = 0;

if(keys["ArrowLeft"])  dx = -player.speed;
if(keys["ArrowRight"]) dx =  player.speed;
if(keys["ArrowUp"])    dy = -player.speed;
if(keys["ArrowDown"])  dy =  player.speed;

// Horizontal movement

let nextX = player.x + dx;

if(!collidesWithWorld(nextX, player.y)){

    player.x = nextX;

}

// Vertical movement

let nextY = player.y + dy;

if(!collidesWithWorld(player.x, nextY)){

    player.y = nextY;

}

    if(player.x<0) player.x=0;
    if(player.y<0) player.y=0;

    if(player.x>MAP_WIDTH*TILE_SIZE-TILE_SIZE)
        player.x=MAP_WIDTH*TILE_SIZE-TILE_SIZE;

    if(player.y>MAP_HEIGHT*TILE_SIZE-TILE_SIZE)
        player.y=MAP_HEIGHT*TILE_SIZE-TILE_SIZE;

    camera.x=player.x-SCREEN_WIDTH/2;
    camera.y=player.y-SCREEN_HEIGHT/2;

    if(camera.x<0) camera.x=0;
    if(camera.y<0) camera.y=0;

for(const enemy of enemies){

    if(enemy.type == 0){

        updateWolf(enemy);

    }
    else{

        updateBandit(enemy);

    }

}

for(const enemy of enemies){

    if(playerHitsEnemy(enemy)){

        loseLife();
        break;

    }

}

    const maxCamX=MAP_WIDTH*TILE_SIZE-SCREEN_WIDTH;
    const maxCamY=MAP_HEIGHT*TILE_SIZE-SCREEN_HEIGHT;

    if(camera.x>maxCamX) camera.x=maxCamX;
    if(camera.y>maxCamY) camera.y=maxCamY;

    camera.renderX = Math.floor(camera.x);
    camera.renderY = Math.floor(camera.y);

    const playerCenterX = player.x + 8;
    const playerCenterY = player.y + 8;

    const tileX = Math.floor(playerCenterX / TILE_SIZE);
    const tileY = Math.floor(playerCenterY / TILE_SIZE);

    if(playerOnTile(TILE.CASTLE)){
        gameState = State.WIN;
    }

}

function drawMap(){

    let startX=Math.floor(camera.renderX/TILE_SIZE);
    let startY=Math.floor(camera.renderY/TILE_SIZE);

    let endX=startX+17;
    let endY=startY+16;

    for(let y=startY;y<=endY;y++){

        for(let x=startX;x<=endX;x++){

            if(x<0||y<0||x>=MAP_WIDTH||y>=MAP_HEIGHT)
                continue;

            const tile=map[y][x];

            const sx = x*TILE_SIZE - camera.renderX;
            const sy = y*TILE_SIZE - camera.renderY;

            switch(tile){

                case TILE.GRASS:
                    drawGrass(sx,sy);
                    break;

                case TILE.ROAD:
                    drawRoad(sx,sy);
                    break;

                case TILE.TREE:
                    drawTree(sx,sy);
                    break;

                case TILE.WATER:
                    drawWater(sx,sy);
                    break;

                case TILE.BRIDGE:
                    drawBridge(sx,sy);
                    break;

                case TILE.CASTLE:
                    drawCastle(sx,sy);
                    break;

                case TILE.VILLAGE:
                    drawVillage(sx,sy);
                    break;

            }

        }

    }

}

function drawHUD(){

    ctx.fillStyle="#000000";
    ctx.fillRect(0,0,256,16);

    ctx.fillStyle="white";
    ctx.font="16px monospace";

    ctx.fillText(
        "LIVES " + player.remainingLives +
        "   TIME " + player.timeRemaining +
        "   DELIVER TREATY",
        4,
        11
    );
}

function render(){

    ctx.fillStyle="black";
    ctx.fillRect(0,0,256,240);

    if(gameState===State.TITLE){

        ctx.fillStyle="black";
        ctx.fillRect(0,0,256,240);

        //
        // Draw logo
        //

        if(titleLogo.complete){

            // centered
            ctx.drawImage(
                titleLogo,
                18,      // x
                12,      // y
                220,     // width
                96       // height
            );

        }

        //
        // Menu text
        //
        ctx.textAlign="center";
        ctx.fillStyle="white";
        ctx.font="bold 16px monospace";

        ctx.fillText(
            "START",
            128,
            145
        );
        ctx.fillText(
            "(press Enter to play)",
            128,
            159
        );

        //
        // License
        //
    
        ctx.fillText(
            "MIT LICENSE",
            128,
            214
        );

        ctx.textAlign="left";

        return;

    }

    if(gameState===State.WIN){

        ctx.fillStyle="white";
        ctx.font="16px monospace";
        ctx.fillText("MISSION",72,90);
        ctx.fillText("COMPLETE",68,112);

        ctx.font="8px monospace";
        ctx.fillText("Refresh to play again",54,160);

        return;

    }

    drawMap();

for(const enemy of enemies){

    if(enemy.type == 0){

        drawWolf(enemy);

    }
    else{

        drawBandit(enemy);

    }

}


    drawPlayer();

    drawHUD();

}

function loop(){

    update();

    render();

    requestAnimationFrame(loop);

}

(async function(){

    await loadLevel();

    resetPositions();

    loop();

})();


</script>

</body>
</html>
