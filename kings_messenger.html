document.addEventListener("keydown",(e)=>{

        gameState = State.TITLE;
    }

    if(e.key==="p" || e.key==="P"){

        if(gameState===State.PLAY){

            pauseStartTime = performance.now();
            gameState = State.PAUSE;

        }
        else if(gameState===State.PAUSE){

            gameState = State.PLAY;

            // Prevent the timer from "catching up"
            lastTimerTick += performance.now() - pauseStartTime;

        }

    }

});

}

async function loadLevel(levelFile){

            await fetch(levelFile,
            {

            }
        );

            throw new Error();

        }

        const level =
            await response.json();

        MAP_HEIGHT = level.height;

	currentLevelName = level.name;

        PLAYER_START_X =
            level.playerStart.x * TILE_SIZE;

        PLAYER_START_Y =
            level.playerStart.y * TILE_SIZE;

        map.length = 0;

        for(let y=0;y<MAP_HEIGHT;y++){

            map.push(
                level.tiles[y].slice()
            );

        }

enemies.length = 0;

for(const e of level.enemies){

    enemies.push({

        type: e.type,

        startX: e.x * TILE_SIZE,
        startY: e.y * TILE_SIZE,

        x: e.x * TILE_SIZE,
        y: e.y * TILE_SIZE,

        width: 8,
        height: 8,

        direction: -1,

        speed:
            e.type == 0 ?
                WOLF_SPEED :
                BANDIT_SPEED,

        patrolAxis: "horizontal",

        state: BanditState.PATROL

    });

}

    }
    catch(error){

        alert(
            "Unable to load " + levelFile
        );

        throw error;

    }

}

async function loadMusic(musicFile){

function buildSprite(sprite, palette){

    const canvas = document.createElement("canvas");

    canvas.width = sprite[0].length;
    canvas.height = sprite.length;

    const c = canvas.getContext("2d");

    c.imageSmoothingEnabled = false;

    for(let y=0;y<sprite.length;y++){

        const row = sprite[y];

        for(let x=0;x<row.length;x++){

            const pixel = row[x];

            if(pixel==".")
                continue;

            c.fillStyle = palette[pixel];
            c.fillRect(x,y,1,1);

        }

    }

    return canvas;

}

function mirrorSprite(sprite){

    const canvas = document.createElement("canvas");

    canvas.width = sprite.width;
    canvas.height = sprite.height;

    const c = canvas.getContext("2d");

    c.imageSmoothingEnabled = false;

    c.translate(sprite.width, 0);
    c.scale(-1, 1);

    c.drawImage(sprite, 0, 0);

    return canvas;

}

function rectsOverlap(ax, ay, aw, ah,
                      bx, by, bw, bh){

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );

}

function collidesWithWorld(
    px,
    py,
    offsetX,
    offsetY,
    width,
    height)
{

    const left = px + offsetX;
    const top = py + offsetY;

    const startTileX = Math.floor(left / TILE_SIZE);
    const startTileY = Math.floor(top / TILE_SIZE);

    const endTileX =
        Math.floor((left + width - 1) / TILE_SIZE);

    const endTileY =
        Math.floor((top + height - 1) / TILE_SIZE);

    for(let ty = startTileY; ty <= endTileY; ty++){

        for(let tx = startTileX; tx <= endTileX; tx++){

            if(tx < 0 || ty < 0 ||
               tx >= MAP_WIDTH ||
               ty >= MAP_HEIGHT)
                return true;

            const tile = map[ty][tx];

            if(TILE_SOLID[tile]){

                if(tile != TILE.TREE)
                    return true;

            }

            const shape = TILE_COLLISION[tile];

            if(shape == null)
                continue;

            if(rectsOverlap(

                left,
                top,
                width,
                height,

                tx * TILE_SIZE + shape.x,
                ty * TILE_SIZE + shape.y,
                shape.w,
                shape.h

            )){

                return true;

            }

        }

    }

    return false;

}

function distanceSquared(x1,y1,x2,y2){

    const dx=x2-x1;
    const dy=y2-y1;

    return dx*dx+dy*dy;

}

function moveBandit(enemy, dx, dy){

    let nextX = enemy.x + dx;
    let nextY = enemy.y + dy;

    if(collidesWithWorld(
        nextX,
        nextY,
        3, 8,
        10, 8))
        return false;

    enemy.x = nextX;
    enemy.y = nextY;

    return true;

}



function updateWolf(enemy){

    let nextX = enemy.x + enemy.direction * enemy.speed;

    if(collidesWithWorld(
        nextX,
        enemy.y,
        2, 4,
        12, 6)) {
        enemy.direction *= -1;

    }
    else{

        enemy.x = nextX;

    }

}

function moveBanditToward(enemy, targetX, targetY){

    const dx = targetX - enemy.x;
    const dy = targetY - enemy.y;

    const moveX = Math.sign(dx) * enemy.speed;
    const moveY = Math.sign(dy) * enemy.speed;

    if(Math.abs(dx) >= Math.abs(dy)){

        if(!moveBandit(enemy, moveX, 0)){
            moveBandit(enemy, 0, moveY);
        }

    }
    else{

        if(!moveBandit(enemy, 0, moveY)){
            moveBandit(enemy, moveX, 0);
        }

    }
}

function updateBandit(enemy){

    switch(enemy.state){

        case BanditState.PATROL:

            if(collidesWithWorld(
                enemy.x + enemy.direction * enemy.speed,
                enemy.y,
                3, 8,
                10, 8))
            {
                enemy.direction*=-1;
            }
            else{

                enemy.x +=
                    enemy.direction*enemy.speed;

            }

            if(
                distanceSquared(

                    player.x,
                    player.y,

                    enemy.x,
                    enemy.y

                )

                <

                BANDIT_DETECTION_RANGE*
                BANDIT_DETECTION_RANGE

            ){

                enemy.state =
                    BanditState.CHASE;

            }

            break;

        case BanditState.CHASE: {

            moveBanditToward(
                enemy,
                player.x,
                player.y
            );

            if(distanceSquared( enemy.startX, enemy.startY, enemy.x, enemy.y ) >
                (BANDIT_CHASE_DISTANCE * BANDIT_CHASE_DISTANCE)) {
                enemy.state = BanditState.RETURN;
            }
            break;
        }
        case BanditState.RETURN: {

            moveBanditToward(
                enemy,
                enemy.startX,
                enemy.startY
            );

            if(Math.abs(enemy.startX - enemy.x) < enemy.speed &&
               Math.abs(enemy.startY - enemy.y) < enemy.speed){

                enemy.x = enemy.startX;
                enemy.y = enemy.startY;

                enemy.state = BanditState.PATROL;
            }

            break;    
        }
    }
}

function playerHitsEnemy(enemy){

    return rectsOverlap(

        player.x + 4,
        player.y + 4,
        player.width,
        player.height,

        enemy.x + 4,
        enemy.y + 4,
        enemy.width,
        enemy.height

    );

}

function loseLife(){

    stopMusic();

    player.remainingLives--;

    endOfLifeStartTime = performance.now();
    endOfLifeMusicPlaying = false;

    gameState = State.END_OF_LIFE;
}

function resetPositions(){

    player.x = PLAYER_START_X;
    player.y = PLAYER_START_Y;

    playerFacingRight = true;
    playerAnimationFrame = 0;
    lastPlayerAnimationTime = performance.now();

    wolfAnimationFrame = 0;
    lastWolfAnimationTime = performance.now();

    banditAnimationFrame = 0;
    lastBanditAnimationTime = performance.now();

camera.x = player.x - SCREEN_WIDTH / 2;
camera.y = player.y - SCREEN_HEIGHT / 2;

if(camera.x < 0) camera.x = 0;
if(camera.y < 0) camera.y = 0;

const maxCamX = MAP_WIDTH * TILE_SIZE - SCREEN_WIDTH;
const maxCamY = MAP_HEIGHT * TILE_SIZE - SCREEN_HEIGHT;

if(camera.x > maxCamX) camera.x = maxCamX;
if(camera.y > maxCamY) camera.y = maxCamY;

camera.renderX = Math.floor(camera.x);
camera.renderY = Math.floor(camera.y);

for(const enemy of enemies){

    enemy.x = enemy.startX;
    enemy.y = enemy.startY;

    enemy.direction = -1;
    enemy.state = BanditState.PATROL;

}

    player.timeRemaining = LEVEL_TIME;
    lastTimerTick = performance.now();
}

function playerOnTile(tileType){

    const tileX = Math.floor((player.x + 8) / TILE_SIZE);
    const tileY = Math.floor((player.y + 8) / TILE_SIZE);

    if(
        tileX < 0 ||
        tileX >= MAP_WIDTH ||
        tileY < 0 ||
        tileY >= MAP_HEIGHT
    ){
        return false;
    }

    return map[tileY][tileX] === tileType;
}

async function update(){

if(gameState === State.GAME_OVER){

    if(performance.now() - gameOverStartTime >= 4000){

        gameState = State.TITLE;

        player.remainingLives = STARTING_LIVES;
        player.timeRemaining = LEVEL_TIME;

        resetPositions();

    }

    return;

}

if(gameState === State.END_OF_LIFE){

    const elapsed =
        performance.now() - endOfLifeStartTime;

    if(elapsed >= 250 && endOfLifeMusic !== null){

        if(!endOfLifeMusicPlaying){

            startMusic(endOfLifeMusic);
            endOfLifeMusicPlaying = true;

        }

    }

    if(elapsed >= 1500){

        stopMusic();

        if(player.remainingLives < 0){

            gameState = State.GAME_OVER;
            gameOverStartTime = performance.now();

        }
        else{

            resetPositions();

            startCurrentLevelMusic();

            gameState = State.PLAY;

        }

    }

    return;
}

if(gameState == State.MISSION_INTRO){

    if(performance.now() - missionIntroStartTime >= 2000){

        lastTimerTick = performance.now();

        gameState = State.PLAY;

    }

    return;

}

    if(gameState!==State.PLAY) return;

const now = performance.now();

if(now - lastTimerTick >= 1000){

    player.timeRemaining--;

    lastTimerTick += 1000;

    if(player.timeRemaining <= 0){

        loseLife();
        return;

    }

}

if(now - lastWolfAnimationTime >= 120){

    wolfAnimationFrame++;

    if(wolfAnimationFrame >= WOLF_RIGHT.length)
        wolfAnimationFrame = 0;

    lastWolfAnimationTime = now;

}

if(now - lastBanditAnimationTime >= 150){

    banditAnimationFrame++;

    if(banditAnimationFrame >= BANDIT.length)
        banditAnimationFrame = 0;

    lastBanditAnimationTime = now;

}

let dx = 0;
let dy = 0;

if(keys["ArrowLeft"])  {
    dx = -player.speed;
    playerFacingRight = false;
}
if(keys["ArrowRight"]) {
    dx =  player.speed;
    playerFacingRight = true;
}
if(keys["ArrowUp"])    dy = -player.speed;
if(keys["ArrowDown"])  dy =  player.speed;

const playerMoving = (dx != 0 || dy != 0);

// Horizontal movement

let nextX = player.x + dx;

if(!collidesWithWorld(
    nextX,
    player.y,
    3, 8,
    10, 8)){
    player.x = nextX;

}

// Vertical movement

let nextY = player.y + dy;

if(!collidesWithWorld(
    player.x,
    nextY,
    3, 8,
    10, 8)){
    player.y = nextY;

}

    if(player.x<0) player.x=0;
    if(player.y<TILE_SIZE) player.y=TILE_SIZE;

    if(player.x>MAP_WIDTH*TILE_SIZE-TILE_SIZE)
        player.x=MAP_WIDTH*TILE_SIZE-TILE_SIZE;

    if(player.y>MAP_HEIGHT*TILE_SIZE-TILE_SIZE)
        player.y=MAP_HEIGHT*TILE_SIZE-TILE_SIZE;

    camera.x=player.x-SCREEN_WIDTH/2;
    camera.y=player.y-SCREEN_HEIGHT/2;

    if(camera.x<0) camera.x=0;
    if(camera.y<0) camera.y=0;

for(const enemy of enemies){

    if(enemy.type == ENEMY.WOLF){

        updateWolf(enemy);

    }
    else{

        updateBandit(enemy);

    }

}

for(const enemy of enemies){

    if(playerHitsEnemy(enemy)){

        loseLife();
        break;

    }

}

if(playerMoving){

    if(now - lastPlayerAnimationTime >= 120){

        playerAnimationFrame++;

        if(playerAnimationFrame >= PLAYER_RIGHT.length)
            playerAnimationFrame = 0;

        lastPlayerAnimationTime = now;

    }

}
else{

    playerAnimationFrame = 0;

}

    const maxCamX=MAP_WIDTH*TILE_SIZE-SCREEN_WIDTH;
    const maxCamY=MAP_HEIGHT*TILE_SIZE-SCREEN_HEIGHT;

    if(camera.x>maxCamX) camera.x=maxCamX;
    if(camera.y>maxCamY) camera.y=maxCamY;

    camera.renderX = Math.floor(camera.x);
    camera.renderY = Math.floor(camera.y);

    const playerCenterX = player.x + 8;
    const playerCenterY = player.y + 8;

    const tileX = Math.floor(playerCenterX / TILE_SIZE);
    const tileY = Math.floor(playerCenterY / TILE_SIZE);

    if(playerOnTile(TILE.CASTLE)){

        stopMusic();

        if(currentLevel < LEVEL_FILES.length - 1){

            await nextLevel();

        }
        else{

            gameState = State.WIN;

        }

    }

}

function drawMap(){

    let startX=Math.floor(camera.renderX/TILE_SIZE);
    let startY=Math.floor(camera.renderY/TILE_SIZE);

    let endX=startX+17;
    let endY=startY+16;

    for(let y=startY;y<=endY;y++){

        for(let x=startX;x<=endX;x++){

            if(x<0||y<0||x>=MAP_WIDTH||y>=MAP_HEIGHT)
                continue;

            const tile=map[y][x];

            const sx = x*TILE_SIZE - camera.renderX;
            const sy = y*TILE_SIZE - camera.renderY;

            switch(tile){

                case TILE.GRASS:
                    drawGrass(sx,sy);
                    break;

                case TILE.ROAD:
                    drawRoad(sx,sy);
                    break;

                case TILE.TREE:
                    drawTree(sx,sy);
                    break;

                case TILE.WATER:
                    drawWater(sx,sy);
                    break;

                case TILE.BRIDGE:
                    drawBridge(sx,sy);
                    break;

                case TILE.CASTLE:
                    drawCastle(sx,sy);
                    break;

                case TILE.VILLAGE:
                    drawVillage(sx,sy);
                    break;

            }

        }

    }

}

function drawHUD(){

    let livesToDisplay = player.remainingLives;

    if(gameState === State.END_OF_LIFE){
        livesToDisplay++;
    }

    ctx.fillStyle="#000000";
    ctx.fillRect(0,0,256,16);

    ctx.fillStyle="white";
    ctx.font="16px monospace";

    ctx.fillText(
        "LIVES " + livesToDisplay +
        "   TIME " + player.timeRemaining,
        4,
        11
    );
}

function render(){

    ctx.fillStyle="black";
    ctx.fillRect(0,0,256,240);

    if(gameState===State.TITLE){

        ctx.fillStyle="black";
        ctx.fillRect(0,0,256,240);

        //
        // Draw logo
        //

        if(titleLogo.complete){

            // centered
            ctx.drawImage(
                titleLogo,
                18,      // x
                12,      // y
                220,     // width
                96       // height
            );

        }

        //
        // Menu text
        //
        ctx.textAlign="center";
        ctx.fillStyle="white";
        ctx.font="bold 16px monospace";

        ctx.fillText(
            "START",
            128,
            145
        );
        ctx.fillText(
            "(press Enter to play)",
            128,
            159
        );

        //
        // License
        //
    
        ctx.fillText(
            "MIT LICENSE",
            128,
            214
        );

        ctx.textAlign="left";

        return;

    }

    if(gameState === State.GAME_OVER){

        ctx.fillStyle = "black";
        ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

        ctx.fillStyle = "white";
        ctx.textAlign="center";
        ctx.fillText(
            "GAME OVER",
            128,
            120
        );
        return;

    }

    if(gameState===State.WIN){

        ctx.fillStyle="black";
        ctx.fillRect(0,0,256,240);

        //
        // Draw castle
        //
        if(winLogo.complete){

            ctx.drawImage(
                winLogo,
                18,     // x
                12,     // y
                220,    // width
                110     // height
            );

        }

        //
        // Text
        //
        ctx.textAlign="center";
        ctx.fillStyle="white";
        ctx.font="bold 16px monospace";

        ctx.fillText(
            "The kingdom celebrates",
            128,
            139
        );

        ctx.fillText(
            "your bravery.",
            128,
            153
        );

        ctx.fillText(
            "Thank you for playing!",
            128,
            183
        );

        ctx.fillText(
            "(press Enter)",
            128,
            215
        );

        ctx.textAlign="left";

        return;

    }

    drawMap();

for(const enemy of enemies){

    if(enemy.type == ENEMY.WOLF){

        drawWolf(enemy);

    }
    else{

        drawBandit(enemy);

    }

}

if(gameState == State.MISSION_INTRO){

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

    ctx.fillStyle = "white";
    ctx.font = "16px monospace";
    ctx.textAlign = "center";

    ctx.fillText(
        "LEVEL " + (currentLevel + 1),
        SCREEN_WIDTH / 2,
        SCREEN_HEIGHT / 2 - 10
    );

    ctx.fillText(
        currentLevelName.toUpperCase(),
        SCREEN_WIDTH / 2,
        SCREEN_HEIGHT / 2 + 10
    );

    ctx.textAlign = "left";
}

    if(gameState===State.PAUSE){

        ctx.fillStyle="rgba(0,0,0,0.5)";
        ctx.fillRect(0,0,256,240);

        ctx.fillStyle="white";
        ctx.font="16px monospace";
        ctx.textAlign="center";

        ctx.fillText(
            "PAUSED",
            128,
            120
        );

        ctx.textAlign="left";

    }

    drawPlayer();

    drawHUD();

    if(gameState === State.END_OF_LIFE){

        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(
            0,
            0,
            SCREEN_WIDTH,
            SCREEN_HEIGHT
        );

    }

}

async function loop(){

    await update();

    render();

    requestAnimationFrame(loop);

}

(async function(){

    await loadLevel(LEVEL_FILES[currentLevel]);

    for(const musicFile of MUSIC_FILES){
        await loadMusic(musicFile);
    }

    const response = await fetch("EndOfLife1.json");
    endOfLifeMusic = await response.json();

    resetPositions();

    loop();

})();


</script>
