<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>King Messenger</title>

<style>
body{
    margin:0;
    background:#202020;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

canvas{
    width:512px;
    height:480px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border:4px solid white;
}
</style>
</head>

<body>

<canvas id="game" width="256" height="240"></canvas>

<script>

const SCREEN_WIDTH=256;
const SCREEN_HEIGHT=240;

const TILE_SIZE=16;

const TILE = {
    GRASS: 0,
    ROAD: 1,
    TREE: 2,
    WATER: 3,
    BRIDGE: 4,
    CASTLE: 5,
    VILLAGE: 6
};

const TILE_SOLID = {
    [TILE.GRASS]: false,
    [TILE.ROAD]: false,
    [TILE.TREE]: true,
    [TILE.WATER]: true,
    [TILE.BRIDGE]: false,
    [TILE.CASTLE]: false,
    [TILE.VILLAGE]: false
};

const TILE_COLLISION = {

    [TILE.GRASS]:   null,
    [TILE.ROAD]:    null,
    [TILE.WATER]:   null,
    [TILE.BRIDGE]:  null,
    [TILE.CASTLE]:  null,
    [TILE.VILLAGE]: null,

    // trunk only
    [TILE.TREE]:{
        x:6,
        y:9,
        w:4,
        h:7
    }

};

const MAP_WIDTH=40;
const MAP_HEIGHT=30;

const PLAYER_START_X = 40;
const PLAYER_START_Y = 15 * TILE_SIZE;

const WOLF_SPEED = 2;

const BANDIT_SPEED = 1;
const BANDIT_DETECTION_RANGE = 64;
const BANDIT_CHASE_DISTANCE = 128;

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const State={
    TITLE:0,
    PLAY:1,
    WIN:2
};

const BanditState = {

    PATROL:0,
    CHASE:1,
    RETURN:2

};

let gameState=State.TITLE;

const keys={};

document.addEventListener("keydown",(e)=>{
    keys[e.key]=true;

    if(gameState===State.TITLE && e.key==="Enter"){
        gameState=State.PLAY;
    }
});

document.addEventListener("keyup",(e)=>{
    keys[e.key]=false;
});

const map=[];

for(let y=0;y<MAP_HEIGHT;y++){

    let row=[];

    for(let x=0;x<MAP_WIDTH;x++){

        row.push(0);

    }

    map.push(row);

}

//
// Build a simple route
//

for(let x=2;x<38;x++){

    map[15][x]=TILE.ROAD;

}

map[15][2]=TILE.CASTLE;
map[15][37]=TILE.VILLAGE;

// Demonstration river

for(let y=4; y<24; y++){

    map[y][20] = TILE.WATER;
    map[y][21] = TILE.WATER;
}

// Demonstration bridge 

map[15][20] = TILE.BRIDGE;
map[15][21] = TILE.BRIDGE;

//
// Forest
//

for(let y=8;y<23;y++){

    for(let x=10;x<18;x++){

        if(Math.random()<0.35){

            map[y][x]=TILE.TREE;

        }

    }

}

const player = {

    x: PLAYER_START_X,
    y: PLAYER_START_Y,

    width:8,
    height:8,

    speed:1,

    lives:3

};

const wolf = {

    startX: 300,
    startY: 15 * TILE_SIZE,

    x:300,
    y:15 * TILE_SIZE,

    width:8,
    height:8,

    speed:WOLF_SPEED,

    direction:-1

};

const bandit = {

    startX:430,
    startY:12*TILE_SIZE,

    x:430,
    y:12*TILE_SIZE,

    width:8,
    height:8,

   
 speed:BANDIT_SPEED,

    direction:-1,

    patrolAxis:"horizontal",

    state:BanditState.PATROL

};
function drawGrass(x,y){

    ctx.fillStyle="#4CAF50";
    ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

}

function drawRoad(x,y){

    ctx.fillStyle="#B07D45";
    ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

}

function drawTree(x,y){

    drawGrass(x,y);

    ctx.fillStyle="#0A5A0A";
    ctx.fillRect(x+4,y+2,8,8);

    ctx.fillStyle="#704020";
    ctx.fillRect(x+7,y+10,2,5);

}

function drawWater(x, y){

    // Dark blue background

    ctx.fillStyle = "#2050C0";
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

    // Light blue ripples

    ctx.fillStyle = "#70B8FF";

    ctx.fillRect(x+2, y+3, 3, 1);
    ctx.fillRect(x+8, y+6, 4, 1);
    ctx.fillRect(x+4, y+11, 5, 1);

}

function drawBridge(x, y){

    // Wooden deck

    ctx.fillStyle = "#8B5A2B";
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

    // Side rails

    ctx.fillStyle = "#5A3515";

    ctx.fillRect(x, 0 + y, TILE_SIZE, 2);
    ctx.fillRect(x, y + 14, TILE_SIZE, 2);

    // Planks

    ctx.fillStyle = "#C09050";

    ctx.fillRect(x + 2, y + 4, 12, 1);
    ctx.fillRect(x + 2, y + 8, 12, 1);
    ctx.fillRect(x + 2, y + 12, 12, 1);

}

function drawCastle(x,y){

    ctx.fillStyle="#B0B0B0";
    ctx.fillRect(x+1,y+2,14,12);

    ctx.fillStyle="#808080";

    ctx.fillRect(x+3,y,2,4);
    ctx.fillRect(x+11,y,2,4);

}

function drawVillage(x,y){

    ctx.fillStyle="#DDDD88";
    ctx.fillRect(x+2,y+5,12,9);

    ctx.fillStyle="#AA3333";
    ctx.beginPath();
    ctx.moveTo(x+1,y+5);
    ctx.lineTo(x+8,y);
    ctx.lineTo(x+15,y+5);
    ctx.fill();

}

function drawPlayer(){

    const px = Math.floor(player.x) - camera.renderX;
    const py = Math.floor(player.y) - camera.renderY;

    ctx.fillStyle="#0000AA";
    ctx.fillRect(
        px+4,
        py+2,
        8,
        12);

    ctx.fillStyle="#FFFF66";
    ctx.fillRect(
        px+5,
        py,
        6,
        5);

}

function drawWolf(){

    const x = Math.floor(wolf.x) - camera.renderX;
    const y = Math.floor(wolf.y) - camera.renderY;

    ctx.fillStyle="#555555";

    ctx.fillRect(x+3,y+5,10,6);

    ctx.fillRect(x+1,y+7,3,3);
    ctx.fillRect(x+12,y+7,3,3);

    ctx.fillStyle="#FFFFFF";

    ctx.fillRect(x+9,y+6,2,2);

}

function drawBandit(){

    const x = Math.floor(bandit.x)-camera.renderX;
    const y = Math.floor(bandit.y)-camera.renderY;

    ctx.fillStyle="#884400";

    ctx.fillRect(x+3,y+2,10,12);

    ctx.fillStyle="#FFFF88";

    ctx.fillRect(x+5,y,6,5);

}

const camera={
    x:0,
    y:0,
    renderX:0,
    renderY:0
};

function rectsOverlap(ax, ay, aw, ah,
                      bx, by, bw, bh){

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );

}

function collidesWithWorld(px, py){

    const playerLeft   = px + 4;
    const playerTop    = py + 4;
    const playerWidth  = player.width;
    const playerHeight = player.height;

    const startTileX = Math.floor(playerLeft / TILE_SIZE);
    const startTileY = Math.floor(playerTop / TILE_SIZE);

    const endTileX =
        Math.floor((playerLeft + playerWidth) / TILE_SIZE);

    const endTileY =
        Math.floor((playerTop + playerHeight) / TILE_SIZE);

    for(let ty=startTileY; ty<=endTileY; ty++){

        for(let tx=startTileX; tx<=endTileX; tx++){

            if(tx<0 || ty<0 ||
               tx>=MAP_WIDTH ||
               ty>=MAP_HEIGHT)
                return true;

            const tile = map[ty][tx];

            // Full-tile collision (water, future walls, etc.)
            if(TILE_SOLID[tile]){

                if(tile != TILE.TREE)
                    return true;
            }

            const shape = TILE_COLLISION[tile];

            if(shape==null)
                continue;

            if(rectsOverlap(

                playerLeft,
                playerTop,
                playerWidth,
                playerHeight,

                tx*TILE_SIZE + shape.x,
                ty*TILE_SIZE + shape.y,
                shape.w,
                shape.h

            )){
                return true;
            }

        }

    }

    return false;

}

function distanceSquared(x1,y1,x2,y2){

    const dx=x2-x1;
    const dy=y2-y1;

    return dx*dx+dy*dy;

}

function moveBandit(dx, dy){

    let nextX = bandit.x + dx;
    let nextY = bandit.y + dy;

    if(collidesWithWorld(nextX, nextY))
        return false;

    bandit.x = nextX;
    bandit.y = nextY;

    return true;

}



function updateWolf(){

    let nextX = wolf.x + wolf.direction * wolf.speed;

    if(collidesWithWorld(nextX, wolf.y)){

        wolf.direction *= -1;

    }
    else{

        wolf.x = nextX;

    }

}

function updateBandit(){

    switch(bandit.state){

        case BanditState.PATROL:

            if(collidesWithWorld(
                bandit.x + bandit.direction*bandit.speed,
                bandit.y))
            {
                bandit.direction*=-1;
            }
            else{

                bandit.x +=
                    bandit.direction*bandit.speed;

            }

            if(
                distanceSquared(

                    player.x,
                    player.y,

                    bandit.x,
                    bandit.y

                )

                <

                BANDIT_DETECTION_RANGE*
                BANDIT_DETECTION_RANGE

            ){

                bandit.state =
                    BanditState.CHASE;

            }

            break;

        case BanditState.CHASE: {

    let dx = player.x - bandit.x;
    let dy = player.y - bandit.y;

    const moveX = Math.sign(dx) * bandit.speed;
    const moveY = Math.sign(dy) * bandit.speed;

    if(Math.abs(dx) >= Math.abs(dy)){

        // Horizontal is the preferred direction

        if(!moveBandit(moveX,0)){

            moveBandit(0,moveY);

        }

    }
    else{

        // Vertical is the preferred direction

        if(!moveBandit(0,moveY)){

            moveBandit(moveX,0);

        }

    }

    if(
        distanceSquared(
            bandit.startX,
            bandit.startY,
            bandit.x,
            bandit.y
        )
        >
        BANDIT_CHASE_DISTANCE *
        BANDIT_CHASE_DISTANCE
    ){

        bandit.state = BanditState.RETURN;

    }

    break;
        }
        case BanditState.RETURN: {

    dx = bandit.startX - bandit.x;
    dy = bandit.startY - bandit.y;

    const returnMoveX = Math.sign(dx) * bandit.speed;
    const returnMoveY = Math.sign(dy) * bandit.speed;

    if(Math.abs(dx) >= Math.abs(dy)){

        // Horizontal is the preferred direction

        if(!moveBandit(returnMoveX, 0)){

            moveBandit(0, returnMoveY);

        }

    }
    else{

        // Vertical is the preferred direction

        if(!moveBandit(0, returnMoveY)){

            moveBandit(returnMoveX, 0);

        }

    }

    // Have we reached home?

    if(Math.abs(dx) < bandit.speed &&
       Math.abs(dy) < bandit.speed){

        bandit.x = bandit.startX;
        bandit.y = bandit.startY;

        bandit.state = BanditState.PATROL;

    }

    break;
        }
    }

}

function playerHitsWolf(){

    return rectsOverlap(

        player.x + 4,
        player.y + 4,
        player.width,
        player.height,

        wolf.x + 4,
        wolf.y + 4,
        wolf.width,
        wolf.height

    );

}

function playerHitsBandit(){

    return rectsOverlap(

        player.x+4,
        player.y+4,
        player.width,
        player.height,

        bandit.x+4,
        bandit.y+4,
        bandit.width,
        bandit.height

    );

}

function resetPositions(){

    player.x = PLAYER_START_X;
    player.y = PLAYER_START_Y;

    wolf.x = wolf.startX;
    wolf.y = wolf.startY;
    wolf.direction = -1;

    bandit.x = bandit.startX;
    bandit.y = bandit.startY;
    bandit.state = BanditState.PATROL;
}

function update(){

    if(gameState!==State.PLAY) return;

let dx = 0;
let dy = 0;

if(keys["ArrowLeft"])  dx = -player.speed;
if(keys["ArrowRight"]) dx =  player.speed;
if(keys["ArrowUp"])    dy = -player.speed;
if(keys["ArrowDown"])  dy =  player.speed;

// Horizontal movement

let nextX = player.x + dx;

if(!collidesWithWorld(nextX, player.y)){

    player.x = nextX;

}

// Vertical movement

let nextY = player.y + dy;

if(!collidesWithWorld(player.x, nextY)){

    player.y = nextY;

}

    if(player.x<0) player.x=0;
    if(player.y<0) player.y=0;

    if(player.x>MAP_WIDTH*TILE_SIZE-TILE_SIZE)
        player.x=MAP_WIDTH*TILE_SIZE-TILE_SIZE;

    if(player.y>MAP_HEIGHT*TILE_SIZE-TILE_SIZE)
        player.y=MAP_HEIGHT*TILE_SIZE-TILE_SIZE;

    camera.x=player.x-SCREEN_WIDTH/2;
    camera.y=player.y-SCREEN_HEIGHT/2;

    if(camera.x<0) camera.x=0;
    if(camera.y<0) camera.y=0;

updateWolf();

updateBandit();

if(playerHitsWolf()){

    player.lives--;

    resetPositions();

    if(player.lives<=0){

        gameState = State.WIN;   // temporary
        // We'll introduce GAME_OVER in the next commit.

    }

}

if(playerHitsBandit()){

    player.lives--;

    resetPositions();

    bandit.x = bandit.startX;
    bandit.y = bandit.startY;
    bandit.state = BanditState.PATROL;

}

    const maxCamX=MAP_WIDTH*TILE_SIZE-SCREEN_WIDTH;
    const maxCamY=MAP_HEIGHT*TILE_SIZE-SCREEN_HEIGHT;

    if(camera.x>maxCamX) camera.x=maxCamX;
    if(camera.y>maxCamY) camera.y=maxCamY;

    camera.renderX = Math.floor(camera.x);
    camera.renderY = Math.floor(camera.y);

    if(player.x>37*TILE_SIZE){

        gameState=State.WIN;

    }

}

function drawMap(){

    let startX=Math.floor(camera.renderX/TILE_SIZE);
    let startY=Math.floor(camera.renderY/TILE_SIZE);

    let endX=startX+17;
    let endY=startY+16;

    for(let y=startY;y<=endY;y++){

        for(let x=startX;x<=endX;x++){

            if(x<0||y<0||x>=MAP_WIDTH||y>=MAP_HEIGHT)
                continue;

            const tile=map[y][x];

            const sx = x*TILE_SIZE - camera.renderX;
            const sy = y*TILE_SIZE - camera.renderY;

            switch(tile){

                case TILE.GRASS:
                    drawGrass(sx,sy);
                    break;

                case TILE.ROAD:
                    drawRoad(sx,sy);
                    break;

                case TILE.TREE:
                    drawTree(sx,sy);
                    break;

                case TILE.WATER:
                    drawWater(sx,sy);
                    break;

                case TILE.BRIDGE:
                    drawBridge(sx,sy);
                    break;

                case TILE.CASTLE:
                    drawCastle(sx,sy);
                    break;

                case TILE.VILLAGE:
                    drawVillage(sx,sy);
                    break;

            }

        }

    }

}

function drawHUD(){

    ctx.fillStyle="#000000";
    ctx.fillRect(0,0,256,16);

    ctx.fillStyle="white";
    ctx.font="8px monospace";

    ctx.fillText(
        "LIVES " + player.lives +
        "   DELIVER TREATY",
        4,
        11
    );
}

function render(){

    ctx.fillStyle="black";
    ctx.fillRect(0,0,256,240);

    if(gameState===State.TITLE){

        ctx.fillStyle="white";
        ctx.font="16px monospace";
        ctx.fillText("KING MESSENGER",28,90);

        ctx.font="8px monospace";
        ctx.fillText("PRESS ENTER",86,130);

        return;

    }

    if(gameState===State.WIN){

        ctx.fillStyle="white";
        ctx.font="16px monospace";
        ctx.fillText("MISSION",72,90);
        ctx.fillText("COMPLETE",68,112);

        ctx.font="8px monospace";
        ctx.fillText("Refresh to play again",54,160);

        return;

    }

    drawMap();

    drawWolf();

    drawBandit();

    drawPlayer();

    drawHUD();

}

function loop(){

    update();

    render();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
