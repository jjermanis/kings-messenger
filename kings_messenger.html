<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>King Messenger</title>

<style>
body{
    margin:0;
    background:#202020;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

canvas{
    width:512px;
    height:480px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border:4px solid white;
}
</style>
</head>

<body>

<canvas id="game" width="256" height="240"></canvas>

<script>

const SCREEN_WIDTH=256;
const SCREEN_HEIGHT=240;

const TILE_SIZE=16;

const TILE = {
    GRASS: 0,
    ROAD: 1,
    TREE: 2,
    WATER: 3,
    BRIDGE: 4,
    CASTLE: 5,
    VILLAGE: 6
};

const TILE_SOLID = {
    [TILE.GRASS]: false,
    [TILE.ROAD]: false,
    [TILE.TREE]: true,
    [TILE.WATER]: true,
    [TILE.BRIDGE]: false,
    [TILE.CASTLE]: false,
    [TILE.VILLAGE]: false
};

const TILE_COLLISION = {

    [TILE.GRASS]:   null,
    [TILE.ROAD]:    null,
    [TILE.WATER]:   null,
    [TILE.BRIDGE]:  null,
    [TILE.CASTLE]:  null,
    [TILE.VILLAGE]: null,

    // trunk only
    [TILE.TREE]:{
        x:6,
        y:9,
        w:4,
        h:7
    }

};

const LEVEL_FILES = [
    "Level1.json",
    "Level2.json",
    "Level3.json"
];

const PLAYER_RIGHT_STAND = [

".....GGGGG......",
"....GGGGGGGG....",
"....GGGGGGRRR...",
"...GGGGGRRSSSG..",
"..GG.GRRSRSKS...",
"......RRRSSSSS..",
".....BBBBSSSS...",
"....BBSSTBSB....",
"....BBSBTTBTTT..",
"....BBSBTTTTTS..",
"....BBSSRRSRRS..",
"....BBBSTTTTTS..",
"....BBBBTTTTT...",
"....BB.RRTTRR...",
"......RR...RR...",
"......RRR..RRR.."

];

const PLAYER_RIGHT_RUN1 = [  

".....GGGGG......",
"....GGGGGGGG....",
"....GGGGGGRRR...",
"...GGGGGRRSSSG..",
"..GG.GRRSRSKS...",
"......RRRSSSSS..",
".....BBBBSSSS...",
"....BBSSTBSBB...",
"....BBSBTTBTTT..",
"....BBSBTTTTTS..",
"....BBSSRRSRRS..",
"....BBBBTTTT....",
"....BBB.TTT.....",
"....BB.RRTTRR...",
"......R...RR....",
".....RRR...RRR.."

];

const PLAYER_RIGHT_RUN2 = [

".....GGGGG......",
"....GGGGGGGG....",
"....GGGGGGRRR...",
"...GGGGGRRSSSG..",
"..GG.GRRSRSKS...",
"......RRRSSSSS..",
".....BBBBSSSS...",
"....BBBSTBSB....",
"....BBSBTTBTTT..",
"....BBSBTTTTTS..",
"....BBSSRRSRRS..",
"....BBBBTTTT....",
".....BBBTTT.....",
"....BBRRT.RR....",
".....RR....R....",
"....RRR....RRR.."

];

const PLAYER_PALETTE = {

    K:"#000000",
    S:"#F8B800",
    G:"#00A800",
    T:"#D8A060",
    B:"#0058F8",
    R:"#7C3C00"

};

let currentLevel = 0;
let currentLevelName = "";

let playerFacingRight = true;

let MAP_WIDTH=40;
let MAP_HEIGHT=30;

const LEVEL_TIME = 200;
const STARTING_LIVES = 2;

const PLAYER_RIGHT = [

    buildSprite(PLAYER_RIGHT_STAND),
    buildSprite(PLAYER_RIGHT_RUN1),
    buildSprite(PLAYER_RIGHT_STAND),
    buildSprite(PLAYER_RIGHT_RUN2)

];

const PLAYER_LEFT =
    PLAYER_RIGHT.map(sprite => mirrorSprite(sprite));

let playerAnimationFrame = 0;
let lastPlayerAnimationTime = 0;

let PLAYER_START_X = 0;
let PLAYER_START_Y = 0;

const WOLF_SPEED = 2;

const BANDIT_SPEED = 1;
const BANDIT_DETECTION_RANGE = 64;
const BANDIT_CHASE_DISTANCE = 128;

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const titleLogo = new Image();
titleLogo.src = "title.png";

ctx.imageSmoothingEnabled=false;

const State={
    TITLE:0,
    MISSION_INTRO:1,
    PLAY:2,
    PAUSE:3,
    WIN:4,
    GAME_OVER:5
};

const ENEMY={

    WOLF:0,
    BANDIT:1

};

const BanditState = {

    PATROL:0,
    CHASE:1,
    RETURN:2

};

let gameState=State.TITLE;
let lastTimerTick = 0;
let missionIntroStartTime = 0;
let pauseStartTime = 0;
let gameOverStartTime = 0;

const keys={};

document.addEventListener("keydown",(e)=>{
    keys[e.key]=true;

    if(gameState===State.TITLE && e.key==="Enter"){
        startNewGame();
    }

    if(e.key==="p" || e.key==="P"){

        if(gameState===State.PLAY){

            pauseStartTime = performance.now();
            gameState = State.PAUSE;

        }
        else if(gameState===State.PAUSE){

            gameState = State.PLAY;

            // Prevent the timer from "catching up"
            lastTimerTick += performance.now() - pauseStartTime;

        }

    }

});

async function startNewGame(){

    currentLevel = 0;

    await loadLevel(LEVEL_FILES[0]);

    resetPositions();

    player.remainingLives = STARTING_LIVES;
    player.timeRemaining = LEVEL_TIME;

    missionIntroStartTime  = performance.now();

    gameState = State.MISSION_INTRO;

}

document.addEventListener("keyup",(e)=>{
    keys[e.key]=false;
});

const map=[];

async function loadLevel(levelFile){

    try{

        const response =
            await fetch(levelFile,
            {
                cache: "no-store"
            }
        );

        if(!response.ok){

            throw new Error();

        }

        const level =
            await response.json();

        MAP_WIDTH = level.width;
        MAP_HEIGHT = level.height;

	currentLevelName = level.name;

        PLAYER_START_X =
            level.playerStart.x * TILE_SIZE;

        PLAYER_START_Y =
            level.playerStart.y * TILE_SIZE;

        map.length = 0;

        for(let y=0;y<MAP_HEIGHT;y++){

            map.push(
                level.tiles[y].slice()
            );

        }

enemies.length = 0;

for(const e of level.enemies){

    enemies.push({

        type: e.type,

        startX: e.x * TILE_SIZE,
        startY: e.y * TILE_SIZE,

        x: e.x * TILE_SIZE,
        y: e.y * TILE_SIZE,

        width: 8,
        height: 8,

        direction: -1,

        speed:
            e.type == 0 ?
                WOLF_SPEED :
                BANDIT_SPEED,

        patrolAxis: "horizontal",

        state: BanditState.PATROL

    });

}

    }
    catch(error){

        alert(
            "Unable to load " + levelFile
        );

        throw error;

    }

}

const player = {

    x: PLAYER_START_X,
    y: PLAYER_START_Y,

    width:8,
    height:8,

    speed:1,

    remainingLives:STARTING_LIVES,

    timeRemaining:LEVEL_TIME
};

const enemies = [];

async function nextLevel(){

    currentLevel++;

    await loadLevel(LEVEL_FILES[currentLevel]);

    resetPositions();

    missionIntroStartTime  = performance.now();

    gameState = State.MISSION_INTRO;

}

function buildSprite(sprite){

    const canvas = document.createElement("canvas");

    canvas.width = 16;
    canvas.height = 16;

    const c = canvas.getContext("2d");

    c.imageSmoothingEnabled = false;

    for(let y=0;y<16;y++){

        const row = sprite[y];

        for(let x=0;x<16;x++){

            const pixel = row[x];

            if(pixel==".")
                continue;

            c.fillStyle = PLAYER_PALETTE[pixel];
            c.fillRect(x,y,1,1);

        }

    }

    return canvas;

}

function mirrorSprite(sprite){

    const canvas = document.createElement("canvas");

    canvas.width = 16;
    canvas.height = 16;

    const c = canvas.getContext("2d");

    c.imageSmoothingEnabled = false;

    c.translate(16, 0);
    c.scale(-1, 1);

    c.drawImage(sprite, 0, 0);

    return canvas;

}

function drawGrass(x,y){

    ctx.fillStyle="#4CAF50";
    ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

}

function drawRoad(x,y){

    ctx.fillStyle="#B09060";
    ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

    ctx.fillStyle="#C8A878";

    ctx.fillRect(x+2,y+4,12,1);
    ctx.fillRect(x+2,y+8,12,1);
    ctx.fillRect(x+2,y+12,12,1);

}

function drawTree(x,y){

    ctx.fillStyle="#3CB043";
    ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

    ctx.fillStyle="#6B3E1F";
    ctx.fillRect(x+6,y+9,4,7);

    ctx.fillStyle="#0B7A20";
    ctx.fillRect(x+2,y+1,12,10);

}

function drawWater(x,y){

    ctx.fillStyle="#2080FF";
    ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

    ctx.fillStyle="#40A0FF";

    ctx.fillRect(x+2,y+4,12,1);
    ctx.fillRect(x+1,y+8,10,1);
    ctx.fillRect(x+4,y+12,8,1);

}

function drawBridge(x, y){

    // Wooden deck

    ctx.fillStyle = "#8B5A2B";
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

    // Side rails

    ctx.fillStyle = "#5A3515";

    ctx.fillRect(x, 0 + y, TILE_SIZE, 2);
    ctx.fillRect(x, y + 14, TILE_SIZE, 2);

    // Planks

    ctx.fillStyle = "#C09050";

    ctx.fillRect(x + 2, y + 4, 12, 1);
    ctx.fillRect(x + 2, y + 8, 12, 1);
    ctx.fillRect(x + 2, y + 12, 12, 1);

}

function drawCastle(x,y){

    ctx.fillStyle = "#3CB043";
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

    ctx.fillStyle="#909090";
    ctx.fillRect(x+2,y+4,12,12);

    ctx.fillStyle="#707070";
    ctx.fillRect(x,y+8,4,8);
    ctx.fillRect(x+12,y+8,4,8);

    ctx.fillStyle="#404040";
    ctx.fillRect(x+6,y+10,4,6);

}

function drawVillage(x,y){

    ctx.fillStyle = "#3CB043";
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

    ctx.fillStyle="#8B5A2B";
    ctx.fillRect(x+4,y+8,8,8);

    ctx.fillStyle="#AA2020";

    ctx.beginPath();
    ctx.moveTo(x+2,y+8);
    ctx.lineTo(x+8,y+2);
    ctx.lineTo(x+14,y+8);
    ctx.fill();

}

function drawPlayer(){

    const px =
        Math.floor(player.x) - camera.renderX;

    const py =
        Math.floor(player.y) - camera.renderY;

    const sprites =
        playerFacingRight ?
            PLAYER_RIGHT :
            PLAYER_LEFT;

    ctx.drawImage(

        sprites[playerAnimationFrame],

        px,
        py

    );

}

function drawWolf(enemy){

    const x = Math.floor(enemy.x) - camera.renderX;
    const y = Math.floor(enemy.y) - camera.renderY;

    ctx.fillStyle="#555555";

    ctx.fillRect(x+3,y+5,10,6);

    ctx.fillRect(x+1,y+7,3,3);
    ctx.fillRect(x+12,y+7,3,3);

    ctx.fillStyle="#FFFFFF";

    ctx.fillRect(x+9,y+6,2,2);

}

function drawBandit(enemy){

    const x = Math.floor(enemy.x)-camera.renderX;
    const y = Math.floor(enemy.y)-camera.renderY;

    ctx.fillStyle="#884400";

    ctx.fillRect(x+3,y+2,10,12);

    ctx.fillStyle="#FFFF88";

    ctx.fillRect(x+5,y,6,5);

}

const camera={
    x:0,
    y:0,
    renderX:0,
    renderY:0
};

function rectsOverlap(ax, ay, aw, ah,
                      bx, by, bw, bh){

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );

}

function collidesWithWorld(px, py){

    const playerLeft   = px + 4;
    const playerTop    = py + 4;
    const playerWidth  = player.width;
    const playerHeight = player.height;

    const startTileX = Math.floor(playerLeft / TILE_SIZE);
    const startTileY = Math.floor(playerTop / TILE_SIZE);

    const endTileX =
        Math.floor((playerLeft + playerWidth) / TILE_SIZE);

    const endTileY =
        Math.floor((playerTop + playerHeight) / TILE_SIZE);

    for(let ty=startTileY; ty<=endTileY; ty++){

        for(let tx=startTileX; tx<=endTileX; tx++){

            if(tx<0 || ty<0 ||
               tx>=MAP_WIDTH ||
               ty>=MAP_HEIGHT)
                return true;

            const tile = map[ty][tx];

            // Full-tile collision (water, future walls, etc.)
            if(TILE_SOLID[tile]){

                if(tile != TILE.TREE)
                    return true;
            }

            const shape = TILE_COLLISION[tile];

            if(shape==null)
                continue;

            if(rectsOverlap(

                playerLeft,
                playerTop,
                playerWidth,
                playerHeight,

                tx*TILE_SIZE + shape.x,
                ty*TILE_SIZE + shape.y,
                shape.w,
                shape.h

            )){
                return true;
            }

        }

    }

    return false;

}

function distanceSquared(x1,y1,x2,y2){

    const dx=x2-x1;
    const dy=y2-y1;

    return dx*dx+dy*dy;

}

function moveBandit(enemy, dx, dy){

    let nextX = enemy.x + dx;
    let nextY = enemy.y + dy;

    if(collidesWithWorld(nextX, nextY))
        return false;

    enemy.x = nextX;
    enemy.y = nextY;

    return true;

}



function updateWolf(enemy){

    let nextX = enemy.x + enemy.direction * enemy.speed;

    if(collidesWithWorld(nextX, enemy.y)){

        enemy.direction *= -1;

    }
    else{

        enemy.x = nextX;

    }

}

function updateBandit(enemy){

    switch(enemy.state){

        case BanditState.PATROL:

            if(collidesWithWorld(
                enemy.x + enemy.direction*enemy.speed,
                enemy.y))
            {
                enemy.direction*=-1;
            }
            else{

                enemy.x +=
                    enemy.direction*enemy.speed;

            }

            if(
                distanceSquared(

                    player.x,
                    player.y,

                    enemy.x,
                    enemy.y

                )

                <

                BANDIT_DETECTION_RANGE*
                BANDIT_DETECTION_RANGE

            ){

                enemy.state =
                    BanditState.CHASE;

            }

            break;

        case BanditState.CHASE: {

    let dx = player.x - enemy.x;
    let dy = player.y - enemy.y;

    const moveX = Math.sign(dx) * enemy.speed;
    const moveY = Math.sign(dy) * enemy.speed;

    if(Math.abs(dx) >= Math.abs(dy)){

        // Horizontal is the preferred direction

        if(!moveBandit(enemy, moveX,0)){

            moveBandit(enemy, 0,moveY);

        }

    }
    else{

        // Vertical is the preferred direction

        if(!moveBandit(enemy, 0,moveY)){

            moveBandit(enemy, moveX,0);

        }

    }

    if(
        distanceSquared(
            enemy.startX,
            enemy.startY,
            enemy.x,
            enemy.y
        )
        >
        BANDIT_CHASE_DISTANCE *
        BANDIT_CHASE_DISTANCE
    ){

        enemy.state = BanditState.RETURN;

    }

    break;
        }
        case BanditState.RETURN: {

    dx = enemy.startX - enemy.x;
    dy = enemy.startY - enemy.y;

    const returnMoveX = Math.sign(dx) * enemy.speed;
    const returnMoveY = Math.sign(dy) * enemy.speed;

    if(Math.abs(dx) >= Math.abs(dy)){

        // Horizontal is the preferred direction

        if(!moveBandit(enemy, returnMoveX, 0)){

            moveBandit(enemy, 0, returnMoveY);

        }

    }
    else{

        // Vertical is the preferred direction

        if(!moveBandit(enemy, 0, returnMoveY)){

            moveBandit(enemy, returnMoveX, 0);

        }

    }

    // Have we reached home?

    if(Math.abs(dx) < enemy.speed &&
       Math.abs(dy) < enemy.speed){

        enemy.x = enemy.startX;
        enemy.y = enemy.startY;

        enemy.state = BanditState.PATROL;

    }

    break;
        }
    }

}

function playerHitsEnemy(enemy){

    return rectsOverlap(

        player.x + 4,
        player.y + 4,
        player.width,
        player.height,

        enemy.x + 4,
        enemy.y + 4,
        enemy.width,
        enemy.height

    );

}

function loseLife(){

    player.remainingLives--;

    if(player.remainingLives < 0){

        gameState = State.GAME_OVER;  
        gameOverStartTime = performance.now();
        return;

    }

    resetPositions();

}

function resetPositions(){

    player.x = PLAYER_START_X;
    player.y = PLAYER_START_Y;

    playerFacingRight = true;
    playerAnimationFrame = 0;
    lastPlayerAnimationTime = performance.now();

camera.x = player.x - SCREEN_WIDTH / 2;
camera.y = player.y - SCREEN_HEIGHT / 2;

if(camera.x < 0) camera.x = 0;
if(camera.y < 0) camera.y = 0;

const maxCamX = MAP_WIDTH * TILE_SIZE - SCREEN_WIDTH;
const maxCamY = MAP_HEIGHT * TILE_SIZE - SCREEN_HEIGHT;

if(camera.x > maxCamX) camera.x = maxCamX;
if(camera.y > maxCamY) camera.y = maxCamY;

camera.renderX = Math.floor(camera.x);
camera.renderY = Math.floor(camera.y);

for(const enemy of enemies){

    enemy.x = enemy.startX;
    enemy.y = enemy.startY;

    enemy.direction = -1;
    enemy.state = BanditState.PATROL;

}

    player.timeRemaining = LEVEL_TIME;
    lastTimerTick = performance.now();
}

function playerOnTile(tileType){

    const tileX = Math.floor((player.x + 8) / TILE_SIZE);
    const tileY = Math.floor((player.y + 8) / TILE_SIZE);

    if(
        tileX < 0 ||
        tileX >= MAP_WIDTH ||
        tileY < 0 ||
        tileY >= MAP_HEIGHT
    ){
        return false;
    }

    return map[tileY][tileX] === tileType;
}

async function update(){

if(gameState === State.GAME_OVER){

    if(performance.now() - gameOverStartTime >= 4000){

        gameState = State.TITLE;

        player.remainingLives = STARTING_LIVES;
        player.timeRemaining = LEVEL_TIME;

        resetPositions();

    }

    return;

}

if(gameState == State.MISSION_INTRO){

    if(performance.now() - missionIntroStartTime >= 2000){

        lastTimerTick = performance.now();

        gameState = State.PLAY;

    }

    return;

}

    if(gameState!==State.PLAY) return;

const now = performance.now();

if(now - lastTimerTick >= 1000){

    player.timeRemaining--;

    lastTimerTick += 1000;

    if(player.timeRemaining <= 0){

        loseLife();
        return;

    }

}

let dx = 0;
let dy = 0;

if(keys["ArrowLeft"])  {
    dx = -player.speed;
    playerFacingRight = false;
}
if(keys["ArrowRight"]) {
    dx =  player.speed;
    playerFacingRight = true;
}
if(keys["ArrowUp"])    dy = -player.speed;
if(keys["ArrowDown"])  dy =  player.speed;

const playerMoving = (dx != 0 || dy != 0);

// Horizontal movement

let nextX = player.x + dx;

if(!collidesWithWorld(nextX, player.y)){

    player.x = nextX;

}

// Vertical movement

let nextY = player.y + dy;

if(!collidesWithWorld(player.x, nextY)){

    player.y = nextY;

}

    if(player.x<0) player.x=0;
    if(player.y<TILE_SIZE) player.y=TILE_SIZE;

    if(player.x>MAP_WIDTH*TILE_SIZE-TILE_SIZE)
        player.x=MAP_WIDTH*TILE_SIZE-TILE_SIZE;

    if(player.y>MAP_HEIGHT*TILE_SIZE-TILE_SIZE)
        player.y=MAP_HEIGHT*TILE_SIZE-TILE_SIZE;

    camera.x=player.x-SCREEN_WIDTH/2;
    camera.y=player.y-SCREEN_HEIGHT/2;

    if(camera.x<0) camera.x=0;
    if(camera.y<0) camera.y=0;

for(const enemy of enemies){

    if(enemy.type == ENEMY.WOLF){

        updateWolf(enemy);

    }
    else{

        updateBandit(enemy);

    }

}

for(const enemy of enemies){

    if(playerHitsEnemy(enemy)){

        loseLife();
        break;

    }

}

if(playerMoving){

    if(now - lastPlayerAnimationTime >= 120){

        playerAnimationFrame++;

        if(playerAnimationFrame >= PLAYER_RIGHT.length)
            playerAnimationFrame = 0;

        lastPlayerAnimationTime = now;

    }

}
else{

    playerAnimationFrame = 0;

}

    const maxCamX=MAP_WIDTH*TILE_SIZE-SCREEN_WIDTH;
    const maxCamY=MAP_HEIGHT*TILE_SIZE-SCREEN_HEIGHT;

    if(camera.x>maxCamX) camera.x=maxCamX;
    if(camera.y>maxCamY) camera.y=maxCamY;

    camera.renderX = Math.floor(camera.x);
    camera.renderY = Math.floor(camera.y);

    const playerCenterX = player.x + 8;
    const playerCenterY = player.y + 8;

    const tileX = Math.floor(playerCenterX / TILE_SIZE);
    const tileY = Math.floor(playerCenterY / TILE_SIZE);

    if(playerOnTile(TILE.CASTLE)){

        if(currentLevel < LEVEL_FILES.length - 1){

            await nextLevel();

        }
        else{

            gameState = State.WIN;

        }

    }

}

function drawMap(){

    let startX=Math.floor(camera.renderX/TILE_SIZE);
    let startY=Math.floor(camera.renderY/TILE_SIZE);

    let endX=startX+17;
    let endY=startY+16;

    for(let y=startY;y<=endY;y++){

        for(let x=startX;x<=endX;x++){

            if(x<0||y<0||x>=MAP_WIDTH||y>=MAP_HEIGHT)
                continue;

            const tile=map[y][x];

            const sx = x*TILE_SIZE - camera.renderX;
            const sy = y*TILE_SIZE - camera.renderY;

            switch(tile){

                case TILE.GRASS:
                    drawGrass(sx,sy);
                    break;

                case TILE.ROAD:
                    drawRoad(sx,sy);
                    break;

                case TILE.TREE:
                    drawTree(sx,sy);
                    break;

                case TILE.WATER:
                    drawWater(sx,sy);
                    break;

                case TILE.BRIDGE:
                    drawBridge(sx,sy);
                    break;

                case TILE.CASTLE:
                    drawCastle(sx,sy);
                    break;

                case TILE.VILLAGE:
                    drawVillage(sx,sy);
                    break;

            }

        }

    }

}

function drawHUD(){

    ctx.fillStyle="#000000";
    ctx.fillRect(0,0,256,16);

    ctx.fillStyle="white";
    ctx.font="16px monospace";

    ctx.fillText(
        "LIVES " + player.remainingLives +
        "   TIME " + player.timeRemaining,
        4,
        11
    );
}

function render(){

    ctx.fillStyle="black";
    ctx.fillRect(0,0,256,240);

    if(gameState===State.TITLE){

        ctx.fillStyle="black";
        ctx.fillRect(0,0,256,240);

        //
        // Draw logo
        //

        if(titleLogo.complete){

            // centered
            ctx.drawImage(
                titleLogo,
                18,      // x
                12,      // y
                220,     // width
                96       // height
            );

        }

        //
        // Menu text
        //
        ctx.textAlign="center";
        ctx.fillStyle="white";
        ctx.font="bold 16px monospace";

        ctx.fillText(
            "START",
            128,
            145
        );
        ctx.fillText(
            "(press Enter to play)",
            128,
            159
        );

        //
        // License
        //
    
        ctx.fillText(
            "MIT LICENSE",
            128,
            214
        );

        ctx.textAlign="left";

        return;

    }

    if(gameState === State.GAME_OVER){

        ctx.fillStyle = "black";
        ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

        ctx.fillStyle = "white";
        ctx.textAlign="center";
        ctx.fillText(
            "GAME OVER",
            128,
            120
        );
        return;

    }

    if(gameState===State.WIN){

        ctx.fillStyle="white";
        ctx.font="16px monospace";
        ctx.fillText("MISSION",72,90);
        ctx.fillText("COMPLETE",68,112);

        ctx.font="8px monospace";
        ctx.fillText("Refresh to play again",54,160);

        return;

    }

    drawMap();

for(const enemy of enemies){

    if(enemy.type == ENEMY.WOLF){

        drawWolf(enemy);

    }
    else{

        drawBandit(enemy);

    }

}

if(gameState == State.MISSION_INTRO){

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);

    ctx.fillStyle = "white";
    ctx.font = "16px monospace";
    ctx.textAlign = "center";

    ctx.fillText(
        "LEVEL " + (currentLevel + 1),
        SCREEN_WIDTH / 2,
        SCREEN_HEIGHT / 2 - 10
    );

    ctx.fillText(
        currentLevelName.toUpperCase(),
        SCREEN_WIDTH / 2,
        SCREEN_HEIGHT / 2 + 10
    );

    ctx.textAlign = "left";
}

    if(gameState===State.PAUSE){

        ctx.fillStyle="rgba(0,0,0,0.5)";
        ctx.fillRect(0,0,256,240);

        ctx.fillStyle="white";
        ctx.font="16px monospace";
        ctx.textAlign="center";

        ctx.fillText(
            "PAUSED",
            128,
            120
        );

        ctx.textAlign="left";

    }

    drawPlayer();

    drawHUD();

}

async function loop(){

    await update();

    render();

    requestAnimationFrame(loop);

}

(async function(){

    await loadLevel(LEVEL_FILES[currentLevel]);

    resetPositions();

    loop();

})();


</script>

</body>
</html>
