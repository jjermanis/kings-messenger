let audioCtx = null;
let playing = false;
let currentSong = null;
let loopTimer = null;

function ensureAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

const NOTE_OFFSETS = {
    "C":-9, "C#":-8, "D":-7, "D#":-6, "E":-5, "F":-4,
    "F#":-3, "G":-2, "G#":-1, "A":0, "A#":1, "B":2
};

function frequency(note) {
    if (!note) return 0;
    const match = note.match(/^([A-G]#?)([0-9])$/);
    if (!match) return 0;
    const semitone = NOTE_OFFSETS[match[1]];
    const octave = Number(match[2]);
    return 440 * Math.pow(2, (semitone + (octave - 4) * 12) / 12);
}

function playTone(note, start, duration, type, volume, output) {
    if (!note) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = frequency(note);

    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

    osc.connect(gain).connect(output);
    osc.start(start);
    osc.stop(start + duration + 0.02);
}

function playDrum(kind, start) {
    if (!kind) return;

    if (kind === "kick") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(130, start);
        osc.frequency.exponentialRampToValueAtTime(55, start + 0.09);
        gain.gain.setValueAtTime(0.22, start);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.12);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.13);
    }

    if (kind === "snare") {
        const buffer = audioCtx.createBuffer(
            1, Math.floor(audioCtx.sampleRate * 0.09), audioCtx.sampleRate
        );
        const data = buffer.getChannelData(0);

        for (let i = 0; i < data.length; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();

        noise.buffer = buffer;
        gain.gain.setValueAtTime(0.12, start);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.09);

        noise.connect(gain).connect(audioCtx.destination);
        noise.start(start);
        noise.stop(start + 0.10);
    }
}

function scheduleSong(song) {
    const secondsPerStep = 60 / song.bpm;
    const start = audioCtx.currentTime + 0.08;
    const loopDuration = 64 * secondsPerStep;

    const master = audioCtx.createGain();
    master.gain.value = 0.8;
    master.connect(audioCtx.destination);

    for (let i = 0; i < 64; i++) {
        const t = start + i * secondsPerStep;

        playTone(song.melody[i], t, secondsPerStep * 0.82,
                 "square", 0.10, master);

        playTone(song.harmony[i], t, secondsPerStep * 0.82,
                 "triangle", 0.055, master);

        playTone(song.bass[i], t, secondsPerStep * 0.88,
                 "square", 0.075, master);

        playDrum(song.drums[i], t);
    }

    loopTimer = setTimeout(function() {
        if (playing && currentSong === song) {
            scheduleSong(song);
        }
    }, loopDuration * 1000 - 40);
}

function playSong(index) {
    stopSong();
    ensureAudio();

    currentSong = SONGS[index];
    playing = true;
    document.getElementById("status").textContent =
        "Playing: " + currentSong.name;

    scheduleSong(currentSong);
}

function stopSong() {
    playing = false;
    currentSong = null;

    if (loopTimer !== null) {
        clearTimeout(loopTimer);
        loopTimer = null;
    }

    document.getElementById("status").textContent = "Stopped";
}

SONGS.forEach(function(song, index) {
    const button = document.createElement("button");
    button.textContent = "Play " + (index + 1) + ": " + song.name;
    button.onclick = function() { playSong(index); };
    document.getElementById("buttons").appendChild(button);
});
